# Testcontainers overrides this URL at runtime via @DynamicPropertySource
spring.datasource.url=jdbc:postgresql://localhost:5432/slotora_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dummy JWT values for tests — must match your @Value keys exactly
jwt.secret=test-secret-key-for-slotora-only-needs-32chars!!
jwt.expiration=3600000